version: "3.9"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ptrp
      MYSQL_USER: ptrp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/ptrp.sql:/docker-entrypoint-initdb.d/01-ptrp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        BASE_PATH: /
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ptrp
      DB_USER: ptrp
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      BASE_PATH: /
      MANUS_PROJECT_ID: ""
      MANUS_OAUTH_PORTAL_URL: ""
      MANUS_OAUTH_API_URL: ""
      MANUS_JWT_SECRET: ${MANUS_JWT_SECRET:?Set MANUS_JWT_SECRET in .env}
      MANUS_API_URL: ""
      MANUS_API_KEY: ""
      OWNER_OPEN_ID: ""
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
